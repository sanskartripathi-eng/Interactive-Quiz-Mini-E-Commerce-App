<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brew &amp; Co. – Mini Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>☕ Brew &amp; Co.</h1>
  <button class="cart-btn" id="openCart" aria-label="Open cart">Cart<span class="badge" id="count">0</span></button>
</header>

<main>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Shopping cart">
  <div class="drawer-head"><h2>Your cart</h2><button class="icon-btn" id="closeCart" aria-label="Close cart">×</button></div>
  <div class="items" id="items"></div>
  <div class="total"><span>Total</span><span id="total">₹0.00</span></div>
  <button class="primary" id="checkout" disabled>Checkout preview</button>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="script.js"></script>
</body>
</html>
